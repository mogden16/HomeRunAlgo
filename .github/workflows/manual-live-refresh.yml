name: Live Refresh

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh mode to run
        required: true
        type: choice
        options:
          - auto
          - settle
          - prepare
          - publish
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: live-refresh
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Resolve requested mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "REFRESH_MODE=auto" >> "$GITHUB_ENV"
            echo "Scheduled refresh mode=auto"
          else
            echo "REFRESH_MODE=${INPUT_MODE}" >> "$GITHUB_ENV"
            echo "Manual refresh mode=${INPUT_MODE}"
          fi

      - name: Decide whether Ballpark Pal refresh is needed
        env:
          REFRESH_MODE: ${{ env.REFRESH_MODE }}
          BALLPARKPAL_EMAIL: ${{ secrets.BALLPARKPAL_EMAIL }}
          BALLPARKPAL_PASSWORD: ${{ secrets.BALLPARKPAL_PASSWORD }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          env_path = Path(os.environ["GITHUB_ENV"])
          refresh_mode = os.environ.get("REFRESH_MODE", "")
          if refresh_mode not in {"auto", "prepare", "publish"}:
              with env_path.open("a", encoding="utf-8") as handle:
                  handle.write("RUN_BPP_REFRESH=false\n")
                  handle.write("BPP_REQUESTED_DATE=\n")
              raise SystemExit(0)

          email = os.environ.get("BALLPARKPAL_EMAIL", "").strip()
          password = os.environ.get("BALLPARKPAL_PASSWORD", "").strip()
          if not email or not password:
              with env_path.open("a", encoding="utf-8") as handle:
                  handle.write("RUN_BPP_REFRESH=false\n")
                  handle.write("BPP_REQUESTED_DATE=\n")
              print("Ballpark Pal refresh skipped: missing credentials.")
              raise SystemExit(0)

          now_et = datetime.now(ZoneInfo("America/New_York"))
          requested_date = now_et.date().isoformat()
          should_run = now_et.hour >= 6
          latest_snapshot = Path("data/ballparkpal/validated/latest_snapshot.json")
          latest_date = ""
          if latest_snapshot.exists():
              try:
                  payload = json.loads(latest_snapshot.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  payload = {}
              latest_date = str(payload.get("requested_date") or payload.get("snapshot_date") or "").strip()
          if latest_date == requested_date:
              should_run = False
          with env_path.open("a", encoding="utf-8") as handle:
              handle.write(f"BPP_REQUESTED_DATE={requested_date}\n")
              handle.write(f"RUN_BPP_REFRESH={'true' if should_run else 'false'}\n")
          print(f"Ballpark Pal refresh requested_date={requested_date} should_run={should_run}")
          PY

      - name: Install Playwright browser for Ballpark Pal refresh
        if: env.RUN_BPP_REFRESH == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Refresh Ballpark Pal snapshot
        if: env.RUN_BPP_REFRESH == 'true'
        env:
          BALLPARKPAL_EMAIL: ${{ secrets.BALLPARKPAL_EMAIL }}
          BALLPARKPAL_PASSWORD: ${{ secrets.BALLPARKPAL_PASSWORD }}
        run: |
          python -m tools.ballparkpal \
            --requested-date "${BPP_REQUESTED_DATE}" \
            --output-root data/ballparkpal

      - name: Run shared refresh mode
        run: |
          extra_args=""
          if [ "${REFRESH_MODE}" = "publish" ] || [ "${REFRESH_MODE}" = "auto" ]; then
            extra_args="--refresh-results-before-publish"
          fi
          python scripts/run_refresh_mode.py --mode "${REFRESH_MODE}" $extra_args

      - name: Commit and push changes
        env:
          REFRESH_MODE: ${{ env.REFRESH_MODE }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from scripts.live_refresh_artifacts import (
              LIVE_REFRESH_FORCE_ADD_BY_MODE,
              LIVE_REFRESH_TRACKED_ARTIFACTS,
          )

          mode = os.environ["REFRESH_MODE"]
          target_branch = os.environ.get("TARGET_BRANCH") or "master"
          tracked = list(LIVE_REFRESH_TRACKED_ARTIFACTS)
          force_add = list(LIVE_REFRESH_FORCE_ADD_BY_MODE.get(mode, ()))

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "--", *tracked], check=True)
          for path in force_add:
              if os.path.exists(path):
                  subprocess.run(["git", "add", "-f", "--", path], check=True)

          unstaged = subprocess.run(
              ["git", "diff", "--name-only"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if unstaged:
              print("Refusing to rebase with unstaged tracked changes:")
              print(unstaged)
              sys.exit(1)

          diff = subprocess.run(
              ["git", "diff", "--cached", "--quiet"],
              check=False,
          )
          if diff.returncode == 0:
              print("No staged refresh changes detected.")
              sys.exit(0)

          commit_label = "scheduled" if mode == "auto" else "manual"
          subprocess.run(["git", "commit", "-m", f"chore: {commit_label} {mode} refresh"], check=True)
          subprocess.run(["git", "fetch", "origin", target_branch], check=True)
          subprocess.run(
              ["git", "rebase", "-X", "theirs", f"origin/{target_branch}"],
              check=True,
          )
          subprocess.run(["git", "push", "origin", f"HEAD:{target_branch}"], check=True)
          PY
